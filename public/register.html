<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Auth System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>📝 Register</h1>
                <p>Create a new account</p>
            </div>
            
            <div class="auth-body">
                <div id="message" class="alert" style="display: none;"></div>
                
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" 
                               placeholder="Choose a username" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" 
                               placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" 
                               placeholder="Create a password (min 6 characters)" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <select id="role" class="form-control">
                            <option value="member">Member (Default)</option>
                            <option value="admin">Admin (Special access)</option>
                        </select>
                        <small style="color: #666; font-size: 12px;">Note: Admin registration for testing only</small>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary btn-block">
                            Create Account
                        </button>
                    </div>
                </form>
                
                <div class="auth-footer">
                    <p>Already have an account? <a href="/login">Login here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            const message = document.getElementById('message');
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, role })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    message.className = 'alert alert-success';
                    message.textContent = `✅ Registration successful! Welcome ${data.user.username}.`;
                    message.style.display = 'block';
                    
                    // Save token and user data
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Show role-specific message
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            alert(`👑 Admin account created! You have full access to all features.`);
                        } else {
                            alert(`👤 Account created! You can now manage your articles.`);
                        }
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    message.className = 'alert alert-error';
                    message.textContent = '❌ ' + data.error;
                    message.style.display = 'block';
                }
            } catch (error) {
                message.className = 'alert alert-error';
                message.textContent = '❌ Network error. Please try again.';
                message.style.display = 'block';
            }
        });
    </script>
</body>
</html>
